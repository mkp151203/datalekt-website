<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Liquidity Drop Wave Dot Grid</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #f0ffff; /* Light cyan background */
      cursor: pointer;
    }

    canvas {
      display: block;
      width: 100vw;
      height: 100vh;
    }

    .hint {
      position: fixed;
      bottom: 18px;
      left: 50%;
      transform: translateX(-50%);
      font-family: system-ui, -apple-system, sans-serif;
      font-size: 12px;
      color: rgba(15, 56, 66, 0.55);
      background: rgba(255, 255, 255, 0.7);
      padding: 6px 14px;
      border-radius: 20px;
      pointer-events: none;
      letter-spacing: 0.3px;
    }
  </style>
</head>
<body>

  <canvas id="liquidityCanvas"></canvas>
  <div class="hint">Click or drag anywhere to create drops (auto-drops also active)</div>

  <script>
    const canvas = document.getElementById('liquidityCanvas');
    const ctx = canvas.getContext('2d');

    let dots = [];
    let drops = [];

    // Grid & Dot Appearance Settings
    const spacingX = 46;       // Horizontal distance between dots in the same row
    const spacingY = 23;       // Vertical distance between staggered rows
    const minRadius = 1.1;     // Resting tiny dot size
    const maxExtraRadius = 2.8;// How much larger dots swell when a wave hits them
    const baseAlpha = 0.35;    // Resting dot opacity

    // Build the staggered dot grid
    function initGrid() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
      dots = [];

      let row = 0;
      for (let y = spacingY; y < canvas.height; y += spacingY) {
        // Offset every odd row by half of spacingX to create the diagonal stagger
        const xOffset = (row % 2 === 0) ? 0 : spacingX / 2;

        for (let x = spacingX / 2 + xOffset; x < canvas.width; x += spacingX) {
          dots.push({ x, y });
        }
        row++;
      }
    }

    // Spawn a circular expanding drop/ripple
    function createDrop(x, y, strength = 1.0) {
      drops.push({
        x: x,
        y: y,
        radius: 0,                  // Starts at center and expands outward
        speed: 2.6,                 // Expansion speed of the ring
        maxRadius: Math.max(canvas.width, canvas.height) * 0.65,
        bandWidth: 65,              // Thickness of the wave ring
        strength: strength
      });
    }

    // Automatically spawn random water drops like the video
    function autoSpawnDrops() {
      if (drops.length < 5) {
        const rx = Math.random() * canvas.width;
        const ry = Math.random() * canvas.height;
        createDrop(rx, ry, 0.85 + Math.random() * 0.35);
      }
      setTimeout(autoSpawnDrops, 900 + Math.random() * 1100);
    }

    // Interactive drops on click or mouse drag
    window.addEventListener('pointerdown', (e) => {
      createDrop(e.clientX, e.clientY, 1.2);
    });

    let lastMoveDrop = 0;
    window.addEventListener('pointermove', (e) => {
      const now = performance.now();
      if (now - lastMoveDrop > 180) {
        createDrop(e.clientX, e.clientY, 0.7);
        lastMoveDrop = now;
      }
    });

    function animate() {
      // Clear background
      ctx.fillStyle = '#f0ffff';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Update expanding drops and remove finished ones
      for (let i = drops.length - 1; i >= 0; i--) {
        drops[i].radius += drops[i].speed;
        if (drops[i].radius > drops[i].maxRadius) {
          drops.splice(i, 1);
        }
      }

      // Draw each dot, calculating how all active wave rings affect its size
      for (let i = 0; i < dots.length; i++) {
        const dot = dots[i];
        let waveEffect = 0;

        for (let j = 0; j < drops.length; j++) {
          const drop = drops[j];
          const dx = dot.x - drop.x;
          const dy = dot.y - drop.y;
          const distFromDropCenter = Math.sqrt(dx * dx + dy * dy);

          // Distance from the expanding wave crest (plus a secondary trailing ripple)
          const distFromCrest1 = Math.abs(distFromDropCenter - drop.radius);
          const distFromCrest2 = Math.abs(distFromDropCenter - (drop.radius - drop.bandWidth * 1.3));

          // Fade the drop's strength as it expands outward
          const lifeFade = Math.max(0, 1 - (drop.radius / drop.maxRadius));

          // Primary wave ring
          if (distFromCrest1 < drop.bandWidth) {
            // Smooth cosine bell curve so dots swell and shrink fluidly
            const curve = (Math.cos((distFromCrest1 / drop.bandWidth) * Math.PI) + 1) / 2;
            waveEffect += curve * lifeFade * drop.strength;
          }

          // Secondary softer trailing ring for realistic liquid feel
          if (drop.radius > drop.bandWidth * 1.3 && distFromCrest2 < drop.bandWidth * 0.8) {
            const curve2 = (Math.cos((distFromCrest2 / (drop.bandWidth * 0.8)) * Math.PI) + 1) / 2;
            waveEffect += curve2 * lifeFade * drop.strength * 0.45;
          }
        }

        // Clamp combined wave effect so overlapping waves don't make giant blobs
        waveEffect = Math.min(waveEffect, 1.35);

        const currentRadius = minRadius + (waveEffect * maxExtraRadius);
        const currentAlpha = Math.min(1, baseAlpha + (waveEffect * 0.65));

        ctx.beginPath();
        ctx.arc(dot.x, dot.y, currentRadius, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(15, 56, 66, ${currentAlpha})`;
        ctx.fill();
      }

      requestAnimationFrame(animate);
    }

    window.addEventListener('resize', initGrid);
    initGrid();

    // Start with two active drops right away
    createDrop(window.innerWidth * 0.35, window.innerHeight * 0.45, 1.1);
    createDrop(window.innerWidth * 0.7, window.innerHeight * 0.6, 1.0);
    autoSpawnDrops();
    animate();
  </script>

</body>
</html>
